name: Career email tracker

on:
  schedule:
    # 12:07 UTC = 20:07 Asia/Shanghai. Avoid the top-of-hour Actions peak.
    - cron: '7 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career-email-tracker
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Read mailbox and update Feishu
        run: python -m career_tracker cloud-run
        env:
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          MAIL_AUTH_CODE: ${{ secrets.MAIL_AUTH_CODE }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_NOTIFY_WEBHOOK: ${{ secrets.FEISHU_NOTIFY_WEBHOOK }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
